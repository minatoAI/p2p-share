<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>在线互传</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="sheet" id="sheet">
      <header class="hd">
        <button class="device" id="deviceBtn" title="切换设备">
          <span class="dot" id="deviceDot"></span>
          <span class="device-name" id="deviceName">办公室电脑</span>
          <span class="device-state" id="deviceState">已连接</span>
          <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" /></svg>
        </button>
        <button class="theme-btn" id="addDeviceBtn" title="添加设备" aria-label="添加设备">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
        </button>
        <button class="theme-btn" id="settingsBtn" title="设置">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" />
            <circle cx="6" cy="4.5" r="1.4" />
            <circle cx="10.5" cy="8" r="1.4" />
            <circle cx="5" cy="11.5" r="1.4" />
          </svg>
        </button>
        <button class="theme-btn" id="themeBtn" title="切换亮色 / 暗色">
          <svg class="sun" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3.1" />
            <path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" />
          </svg>
          <svg class="moon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z" />
          </svg>
        </button>
        <button class="collapse" id="collapseBtn" title="收回到托盘">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" /></svg>
        </button>
      </header>

      <button class="banner" id="saveBanner" hidden>
        <svg class="warn" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 2.2 14.2 13.4H1.8L8 2.2Z" />
          <path d="M8 6.4v3.1M8 11.4v.1" />
        </svg>
        <span class="banner-text">
          <b>还没设置保存位置</b>
          <i>收到的文件会放到这里</i>
        </span>
        <span class="go">选择</span>
      </button>

      <div class="tabs" id="tabs">
        <span class="thumb" id="tabThumb"></span>
        <button class="tab" data-tab="clip" aria-selected="true">剪贴板</button>
        <button class="tab" data-tab="files" aria-selected="false">传输记录</button>
      </div>

      <main class="view" id="view-list">
        <div class="clip-head" id="clipHead">
          <span class="clip-head-title">剪贴板记录</span>
          <button class="btn secondary tiny" id="pushClip" title="把这台电脑剪贴板里的文字发给对方">
            粘贴给对方
          </button>
        </div>
        <div class="list" id="clipList"></div>
        <div class="groups" id="fileList" hidden>
          <section class="group" id="groupDirect">
            <header class="group-hd" data-group="direct">
              <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" /></svg>
              <span class="group-title">直接传输</span>
              <span class="group-count" id="directCount"></span>
            </header>
            <div class="group-body" id="directBody"></div>
          </section>
          <div class="splitter" id="splitter" title="拖动调整高度"><i></i></div>
          <section class="group" id="groupShares">
            <header class="group-hd" data-group="shares">
              <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" /></svg>
              <span class="group-title">我分享的链接</span>
              <span class="group-count" id="sharesCount"></span>
            </header>
            <div class="group-body" id="sharesBody"></div>
          </section>
        </div>
      </main>

      <main class="view" id="view-send" hidden>
        <div class="sub-hd">
          <button class="back" data-back aria-label="返回">←</button>
          <span>发送文件</span>
        </div>
        <div class="send-body">
          <div class="picked">
            <div class="picked-name" id="pickedName"></div>
            <div class="picked-meta" id="pickedMeta"></div>
          </div>
          <div class="field-label">发给谁？</div>
          <div class="targets" id="targets"></div>
        </div>
        <div class="view-ft">
          <button class="btn primary" id="sendGo">发送</button>
        </div>
      </main>

      <main class="view" id="view-link" hidden>
        <div class="sub-hd">
          <button class="back" data-back aria-label="返回">←</button>
          <span>分享链接</span>
        </div>
        <div class="link-body">
          <div class="okmark" id="linkMark">✓</div>
          <div class="link-title" id="linkTitle">链接已复制</div>
          <div class="link-desc" id="linkDesc">发给对方，打开就能取到这份文件。</div>
          <div class="link-box">
            <div class="link-text" id="linkText"></div>
            <button class="btn tiny" id="copyLink">复制</button>
          </div>
        </div>
        <div class="view-ft">
          <button class="btn ghost wide" id="linkDone">完成</button>
        </div>
      </main>


      <main class="view" id="view-pair" hidden>
        <div class="sub-hd">
          <button class="back" data-back aria-label="返回">←</button>
          <span>添加设备</span>
        </div>
        <div class="pair-body">
          <p class="lede" id="pairLede">在另一台设备上打开「在线互传」，输入它显示的六位数字。</p>
          <div class="pair-input-row">
            <input id="pairCode" class="code-input" inputmode="numeric" maxlength="6" placeholder="000000" />
            <button class="btn tiny scan-btn" id="pairCam" title="扫码添加">扫码</button>
          </div>
          <button class="btn primary wide" id="pairGo">连接</button>
          <div class="or"><span>或者</span></div>
          <button class="btn secondary wide" id="pairScan">让对方连我</button>
          <div class="my-code" id="myCodeBox" hidden>
            <span class="my-code-label">我的配对码</span>
            <span class="my-code-value" id="myCode">------</span>
            <div class="pair-qr" id="pairQrBox" hidden>
              <canvas id="pairQr" width="296" height="296"></canvas>
              <span class="pair-qr-hint">对方扫码也能添加</span>
            </div>
            <div class="code-links">
              <button class="pair-link" id="copyPairLink" hidden>复制配对链接</button>
              <button class="pair-link" id="backToInput">我来连对方</button>
            </div>
          </div>
        </div>
      </main>

      <main class="view" id="view-scan" hidden>
        <div class="sub-hd">
          <button class="back" data-back aria-label="返回">←</button>
          <span>扫码添加设备</span>
        </div>
        <div class="scan-body">
          <div class="scan-frame">
            <video id="scanVideo" muted playsinline autoplay></video>
            <div class="scan-veil" id="scanVeil">正在打开摄像头…</div>
          </div>
          <p class="scan-desc" id="scanDesc">把对方设备上的二维码放进框里，认出来就会自动连接。</p>
          <button class="btn secondary wide" id="scanPick">从图片选择</button>
          <input type="file" id="scanFile" accept="image/*" hidden />
        </div>
      </main>

      <main class="view" id="view-settings" hidden>
        <div class="sub-hd">
          <button class="back" data-back aria-label="返回">←</button>
          <span>设置</span>
        </div>
        <div class="settings-body">
          <div class="field-label">这台电脑的名字</div>
          <div class="contact-row">
            <input class="text-input" id="setDeviceName" maxlength="32" />
            <button class="mini primary" id="setDeviceNameSave">保存</button>
          </div>

          <div class="field-label">接收的文件保存到</div>
          <button class="btn secondary wide path-btn" id="setSavePath">
            <span id="setSavePathText">选择文件夹…</span>
          </button>

          <div class="field-label">收到文件时</div>
          <select class="text-input" id="setSound"></select>

          <label class="rowline">
            <input type="checkbox" id="setAutosync" />
            <span>剪贴板自动同步</span>
          </label>
          <label class="rowline">
            <input type="checkbox" id="setCopyReceived" />
            <span>收到文件后放到剪贴板</span>
          </label>
          <label class="rowline">
            <input type="checkbox" id="setAutostart" />
            <span>开机自启</span>
          </label>
          <label class="rowline">
            <input type="checkbox" id="setSendto" />
            <span>加入「发送到」菜单</span>
          </label>

          <div class="field-label">已配对设备</div>
          <div class="contact-list" id="contactList"></div>

          <button class="btn ghost wide" id="setOpenFull">打开完整界面</button>
        </div>
      </main>

      <footer class="ft" id="homeFt">
        <div class="send-row">
          <button class="btn primary" id="pickFiles">
            <span id="sendLabel">发送文件</span>
            <span class="send-hint" id="sendHint">可发给设备，或创建分享链接</span>
          </button>
          <button class="btn primary caret" id="pickMenu" title="更多发送方式">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5 12 6.5" /></svg>
          </button>
        </div>
      </footer>
    </div>

    <div class="popmenu" id="popmenu" hidden></div>

    <div class="modal" id="pairModal" hidden>
      <div class="modal-card">
        <div class="modal-kicker" id="pairAskKicker">配对请求</div>
        <div class="modal-title" id="pairAskName">对方设备</div>
        <p class="modal-desc" id="pairAskDesc">两边屏幕上的核对数字要一致。不一致说明可能有人在中间换钥匙。</p>
        <div class="modal-sas" id="pairAskSas">000 000</div>
        <div class="modal-actions">
          <button class="btn secondary" id="pairReject">不一致</button>
          <button class="btn primary" id="pairAccept">一致，添加设备</button>
        </div>
      </div>
    </div>

    <div class="modal" id="fileModal" hidden>
      <div class="modal-card">
        <div class="modal-kicker">文件操作</div>
        <div class="modal-title" id="fileAskName">文件名</div>
        <div class="file-detail" id="fileAskMeta"></div>
        <div class="file-path" id="fileAskPath"></div>
        <div class="modal-actions">
          <button class="btn ghost" id="fileCancel">取消</button>
          <button class="btn secondary" id="fileSaveAs">另存为…</button>
          <button class="btn secondary" id="fileReveal">在文件夹中显示</button>
          <button class="btn primary" id="fileOpen">打开文件</button>
        </div>
      </div>
    </div>

    <div class="modal" id="confirmModal" hidden>
      <div class="modal-card">
        <div class="modal-kicker" id="confirmKicker">确认</div>
        <div class="modal-title" id="confirmTitle">确定要这样做吗</div>
        <p class="modal-desc" id="confirmDesc"></p>
        <div class="modal-actions">
          <button class="btn ghost" id="confirmCancel">取消</button>
          <button class="btn primary" id="confirmOk">确定</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="qrcode.js"></script>
    <script src="jsqr.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
